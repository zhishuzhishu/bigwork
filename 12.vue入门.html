<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <!-- 插值表达式 -->
        <h1>{{message}}</h1>
    </div>
    <script type="module">
        // 用import引入es模块
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js' 
        // 创建vue实例
        createApp({
            data(){
                return{
                    message:'hello world'
                }
            }
        }).mount('#app');
        </script>
</body>
</html>
