    <link rel="stylesheet" href="css/style.css">
    <style> /*商品详情页样式 */
        .container{width:1100px;margin:40px auto;display:flex;gap:50px;align-items:center;}

        .left img{width:100%;border:1px #eee solid;object-fit:cover;}
        .right{flex:1;}
        .g-price{font-size:28px;color:#ff6700;margin:18px 0;font-weight:bold;}
        .desc-text{color:#555;line-height:1.7;margin-bottom:35px;font-size:15px;}
        .addcart{background:#f44336;color:#fff;border:none;padding:12px 36px;font-size:17px;cursor:pointer;border-radius:4px;}
        .addcart:hover{background:#d62828;}
        .back{display:inline-block;margin-top:25px;color:#666;}

</head>
<body>

//默认展示：居家馆纯棉四件套（你截图商品）
let nowId = location.search ? location.search.split('=')[1] : 17;
let currGood = goodsData.find(item=>item.id == nowId);

//页面填充数据
document.getElementById('goodImg').src = currGood.img;
document.getElementById('goodName').innerText = currGood.name;
document.getElementById('goodPrice').innerText = '¥'+currGood.price;
document.getElementById('goodDesc').innerText = currGood.desc;

//加入购物车逻辑
let cart = JSON.parse(localStorage.getItem('cart'))||[];
document.getElementById('addBtn').onclick = function(){
    let findGood = cart.find(g=>g.name === currGood.name);
    findGood ? findGood.num++ : cart.push({name:currGood.name,price:currGood.price,num:1});
    localStorage.setItem('cart',JSON.stringify(cart));
    alert(`【${currGood.name}】已成功加入购物车！`);
}
</script>
</body>
</html>
