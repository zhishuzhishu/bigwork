<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录注册 - 小兔鲜儿</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .login-box{width:420px;margin:80px auto;padding:30px;border:1px #eee solid;border-radius:8px;}
        .tab{display:flex;border-bottom:1px #eee solid;margin-bottom:20px;}
        .tab>div{flex:1;text-align:center;padding:10px;font-size:18px;cursor:pointer;}
        .tab .active{color:#f44336;border-bottom:2px solid #f44336;}
        .form-item{margin:15px 0;}
        input{width:100%;box-sizing:border-box;height:38px;padding:0 10px;border:1px #ccc solid;outline:none;}
        button{width:100%;height:40px;background:#f44336;color:#fff;border:none;margin-top:10px;cursor:pointer;}
        .reg-form{display:none;}
    </style>
</head>
<body>
<div class="login-box">
    <div class="tab">
        <div class="active" id="login-tab">登录</div>
        <div id="reg-tab">注册</div>
    </div>
    <!--登录表单-->
    <div class="login-form">
        <div class="form-item">
            <input type="text" id="login-user" placeholder="请输入账号">
        </div>
        <div class="form-item">
            <input type="password" id="login-pwd" placeholder="请输入密码">
        </div>
        <button id="login-btn">立即登录</button>
    </div>
    <!--注册表单-->
    <div class="reg-form">
        <div class="form-item">
            <input type="text" id="reg-user" placeholder="请设置账号">
        </div>
        <div class="form-item">
            <input type="password" id="reg-pwd" placeholder="请设置6位以上密码">
        </div>
        <button id="reg-btn">立即注册</button>
    </div>
    <p style="text-align:center;margin-top:15px;"><a href="../index.html">返回首页</a></p>
    <p style="text-align:center;margin-top:8px">学号：24215220224 | 姓名：陈汉城</p>
</div>

<script>
//切换登录/注册面板
const loginTab = document.getElementById('login-tab');
const regTab = document.getElementById('reg-tab');
const loginDom = document.querySelector('.login-form');
const regDom = document.querySelector('.reg-form');
loginTab.onclick=()=>{
    loginTab.classList.add('active');regTab.classList.remove('active');
    loginDom.style.display='block';regDom.style.display='none';
}
regTab.onclick=()=>{
    regTab.classList.add('active');loginTab.classList.remove('active');
    regDom.style.display='block';loginDom.style.display='none';
}

//读取本地用户数组
let userList = JSON.parse(localStorage.getItem('userList'))||[];
//注册
document.getElementById('reg-btn').onclick=()=>{
    let un = document.getElementById('reg-user').value.trim();
    let pd = document.getElementById('reg-pwd').value.trim();
    if(!un){alert('账号不能为空');return;}
    if(pd.length<6){alert('密码不能少于6位');return;}
    if(userList.find(v=>v.username===un)){alert('账号已被注册');return;}
    userList.push({username:un,pwd:pd});
    localStorage.setItem('userList',JSON.stringify(userList));
    alert('注册成功，请登录');
    loginTab.click();
}
//登录
document.getElementById('login-btn').onclick=()=>{
    let un = document.getElementById('login-user').value.trim();
    let pd = document.getElementById('login-pwd').value.trim();
    let user = userList.find(v=>v.username===un&&v.pwd===pd);
    if(!user){alert('账号或密码错误');return;}
    localStorage.setItem('loginUser',JSON.stringify(user));
    alert('登录成功');
    location.href="../index.html";
}
</script>
</body>
</html>
